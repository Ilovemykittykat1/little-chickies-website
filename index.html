<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta charset="UTF-8" />

  <title>Little Chickies | Pizza & Takeout</title>
  <meta name="description" content="Little Chickies is a local pizza place serving fresh, hot pizza and takeout favourites." />
  <meta name="keywords" content="Little Chickies, pizza, takeout, restaurant, local pizza" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Little Chickies" />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- NAV BAR -->
  <nav class="navbar">
    <div class="nav-left">
      <img src="images/logo.png" alt="Little Chickies Pizza Logo" class="logo" />
    </div>

    <!-- DARK MODE TOGGLE -->
    <button id="theme-toggle" class="theme-toggle" type="button">
      <span class="toggle-circle"></span>
    </button>

    <div class="hamburger" onclick="toggleMenu()">☰</div>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="products.html">Menu</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- HERO / SLIDESHOW -->
  <header class="hero" id="home">
    <img src="images/food.jpg" class="hero-image active" />
    <img src="images/image3.jpg" class="hero-image" />
    <img src="images/image2.jpg" class="hero-image" />
  </header>

  <!-- SPECIALS SECTION -->
  <h2 class="specials-heading">OUR SPECIALS</h2>

  <section class="specials">
    <div class="special-item">
      <img src="images/image4.jpg" alt="Large Pizza & 2L Pop Special" />
    </div>

    <div class="special-item">
      <img src="images/image5.jpg" alt="X-Large Pizza & 2L Pop Special" />
    </div>
  </section>

  <!-- VIEW MENU BUTTON -->
  <div class="view-menu-wrapper">
    <a href="products.html" class="view-menu-btn">VIEW MENU</a>
  </div>

  <!-- PROMO BANNER -->
  <section class="promo-banner">
    <img src="images/banner.jpg" alt="Little Chickies Promotion Banner" />
  </section>

  <h2 class="bottom-section-heading">BEST FOOD IN TOWN</h2>

  <section class="home-call-banner-section">
    <img src="images/homebanner.jpg" class="home-call-banner-img" alt="Call Little Chickies Now">
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-content">
      <ul class="footer-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="products.html">Menu</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li>
          <a href="https://www.facebook.com/p/Little-Chickies-Pizza-100057653250842/" target="_blank">
            <i class="fa-brands fa-facebook"></i>
          </a>
        </li>
      </ul>

      <p class="footer-copy">
        © 2026 Little Chickies Pizza. All Rights Reserved.
      </p>
    </div>
  </footer>

  <!-- LINK YOUR MAIN SCRIPT -->
  <script src="script.js"></script>

</body>
</html>
