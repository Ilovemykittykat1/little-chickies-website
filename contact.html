<!DOCTYPE html>
<html lang="en">
<head>

  <title>Contact | Little Chickies Pizza</title>
  <meta name="description" content="Contact Little Chickies Pizza for orders, questions, or catering inquiries." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  
  <link rel="stylesheet" href="styles.css?v=5">
</head>

<body>

  <!-- NAV BAR -->
  <nav class="navbar">
    <div class="nav-left">
      <img src="images/logo.png" alt="Little Chickies Pizza Logo" class="logo" />
    </div>

    <div class="hamburger" onclick="toggleMenu()">☰</div>

 <ul class="nav-links">
  <li><a href="index.html">Home</a></li>
  <li><a href="about.html">About</a></li>
  <li><a href="products.html">Menu</a></li>
  <li><a href="contact.html">Contact</a></li>

  <li class="theme-item">
    <button id="theme-toggle" class="theme-toggle" type="button">
      <span class="toggle-circle"></span>
    </button>
  </li>
</ul>
  </nav>

<!-- TOP HERO BANNER -->
<!-- CONTACT TOP IMAGE -->


  <!-- CONTACT FORM SECTION -->
  <section class="contact-section">
    <h2 class="contact-heading">Get In Touch</h2>

    <form class="contact-form">
      <div class="form-group">
        <input type="text" placeholder="Your Name" required>
      </div>

      <div class="form-group">
        <input type="email" placeholder="Your Email" required>
      </div>

      <div class="form-group">
        <input type="text" placeholder="Subject">
      </div>

      <div class="form-group">
        <textarea rows="5" placeholder="Your Message" required></textarea>
      </div>

      <button type="submit" class="contact-btn">Send Message</button>
    </form>
  </section>
</section>
<div class="call-now-wrapper">
  <a href="tel:+19028499999" class="call-now-btn">
    🐥 Call Now
  </a>
</div>
<section class="home-call-banner-section">
  <img 
    id="call-banner"
    src="images/homebanner2.jpg"
    class="home-call-banner-img"
    alt="Call Little Chickies Now">
</section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-content">
      <ul class="footer-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="products.html">Menu</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li>
          <a href="https://www.facebook.com/p/Little-Chickies-Pizza-100057653250842/" target="_blank">
            <i class="fa-brands fa-facebook"></i>
          </a>
        </li>
      </ul>

      <p class="footer-copy">
        © 2026 Little Chickies Pizza. All Rights Reserved.
      </p>
    </div>
  </footer>

  <script>
    function toggleMenu() {
      document.querySelector('.nav-links').classList.toggle('active');
    }
  </script>
<script src="script.js"></script>

</body>
</html>
